<title>Lumen TV Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a fixed 1920 x 1080 tvOS canvas (1 CSS px = 1 tvOS point = 0.5 dp on Android TV),
   scaled to fit the window, with an on-screen remote under it. Dark only, as tvOS media apps. */
:root {
  --bg: #000;
  --fg: #fff;
  --fg-2: rgba(235, 235, 245, 0.68);
  --fg-3: rgba(235, 235, 245, 0.42);
  --glass: rgba(60, 60, 67, 0.42);
  --glass-strong: rgba(28, 28, 30, 0.72);
  --fill: rgba(255, 255, 255, 0.14);
  --fill-2: rgba(255, 255, 255, 0.22);
  --live: #ff4245;
  --accent: #0091ff;
  --sep: rgba(84, 84, 88, 0.6);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  /* tvOS text styles, in points */
  --t-title1: 76px; --t-title2: 57px; --t-title3: 48px; --t-headline: 38px;
  --t-callout: 31px; --t-body: 29px; --t-cap1: 25px; --t-cap2: 23px;
  --safe-x: 80px; --safe-y: 60px;
  --spring: cubic-bezier(0.2, 0.9, 0.3, 1.08);
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; box-sizing: border-box; }
#viewport { position: relative; flex: 1; min-height: 0; }
#stage { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000;
  border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.6);
  font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }

/* ---------- Remote ---------- */
.remote { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; color: var(--fg-2); font-size: 13px; }
.remote .grp { display: flex; gap: 6px; align-items: center; }
.remote button { font: 600 13px/1 var(--font); color: #fff; background: #1c1c1e; border: 0; border-radius: 999px; min-width: 40px; height: 36px; padding: 0 14px; cursor: pointer; }
.remote button:active { transform: scale(.94); background: #2c2c2e; }
.remote button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.remote .hint { font-size: 12px; color: var(--fg-3); }
.remote .hint kbd { font: 600 11px var(--font); background: #1c1c1e; border-radius: 5px; padding: 2px 6px; color: var(--fg-2); }
@media (max-width: 700px) { .remote .hint { display: none; } }

/* ---------- Artwork (generated: the mockup ships no real posters) ---------- */
.art { position: absolute; inset: 0; background-size: cover; }
.grain::after { content: ""; position: absolute; inset: 0; opacity: .16; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ---------- Tab bar: a glass capsule at the top, hidden while content scrolls ---------- */
#tabbar { position: absolute; top: 44px; left: 0; right: 0; display: flex; justify-content: center; z-index: 20;
  transition: transform .5s var(--ease), opacity .4s var(--ease); }
#tabbar.away { transform: translateY(-140px); opacity: 0; }
#tabbar .cap { display: flex; gap: 6px; padding: 8px; border-radius: 999px; background: var(--glass);
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.08), 0 10px 40px rgba(0,0,0,.35); }
.tab { font: 500 var(--t-cap1)/1 var(--font); color: var(--fg-2); padding: 16px 30px; border-radius: 999px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.tab.sel { color: #fff; background: var(--fill); font-weight: 600; }
.tab svg { width: 28px; height: 28px; }
.tab.f.focus { background: #fff; color: #000; transform: scale(1.08); box-shadow: 0 12px 30px rgba(0,0,0,.45); }

/* ---------- Focus: the tvOS focus effect ---------- */
.f { position: relative; transition: transform .35s var(--spring), box-shadow .35s var(--ease), background-color .2s, color .2s; outline: none; }
.f.focus { z-index: 5; }
.f.pressed { transform: scale(.96) !important; transition-duration: .08s; }
.tile { border-radius: 22px; overflow: hidden; flex: none; background: #1c1c1e; transform: perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); }
.tile.focus { transform: perspective(1200px) scale(1.1) translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  box-shadow: 0 34px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08); }
.tile .sheen { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s, background-position .5s var(--ease);
  background: radial-gradient(60% 50% at var(--sx,30%) 0%, rgba(255,255,255,.32), rgba(255,255,255,0) 70%); }
.tile.focus .sheen { opacity: 1; }
.btn { font: 600 var(--t-callout)/1 var(--font); color: #fff; background: var(--fill); border-radius: 18px; padding: 22px 38px;
  display: inline-flex; align-items: center; gap: 14px; white-space: nowrap;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.btn svg { width: 30px; height: 30px; }
.btn.icon { padding: 22px; }
.btn.f.focus { background: #fff; color: #000; transform: scale(1.08); box-shadow: 0 18px 40px rgba(0,0,0,.5); }

/* ---------- Screen chrome ---------- */
#screen { position: absolute; inset: 0; }
.scroller { position: absolute; left: 0; right: 0; top: 0; transition: transform .6s var(--ease); will-change: transform; }
.hero { position: relative; height: 1080px; overflow: hidden; }
.hero .art { transform-origin: 70% 40%; animation: drift 30s ease-in-out infinite alternate; }
@keyframes drift { to { transform: scale(1.07) translateX(-20px); } }
.hero .shade { position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,0) 70%),
              linear-gradient(0deg, #000 0%, rgba(0,0,0,.6) 22%, rgba(0,0,0,0) 50%); }
.hero .body { position: absolute; left: var(--safe-x); bottom: 300px; width: 1000px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font: 600 var(--t-cap2)/1.2 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.wordmark { font: 800 112px/0.95 var(--font); letter-spacing: -0.035em; text-wrap: balance; }
.meta { font: 500 var(--t-cap1)/1.3 var(--font); color: var(--fg-2); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.meta .pill { border: 2px solid var(--fg-3); border-radius: 6px; padding: 0 8px; font-size: 20px; line-height: 28px; }
.desc { font: 400 var(--t-body)/1.38 var(--font); color: var(--fg-2); max-width: 900px; }
.actions { display: flex; gap: 24px; margin-top: 14px; align-items: center; }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.progress i { display: block; height: 100%; background: #fff; border-radius: inherit; }
.resume-line { display: flex; align-items: center; gap: 18px; font: 500 var(--t-cap1)/1 var(--font); color: var(--fg-2); }
.resume-line .progress { width: 220px; }

.rows { position: relative; display: flex; flex-direction: column; gap: 56px; padding-bottom: 140px; }
.hero + .rows { margin-top: -230px; }
.row h3 { margin: 0 0 22px var(--safe-x); font: 600 var(--t-headline)/1 var(--font); letter-spacing: -0.015em; }
.row .clip { overflow: visible; }
.track { display: flex; gap: 40px; padding: 18px var(--safe-x) 26px; transition: transform .55s var(--ease); will-change: transform; }

.ep { width: 520px; height: 292px; }
.ep-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 24px 20px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
.ep-cap b { display: block; font: 600 var(--t-cap1)/1.2 var(--font); }
.ep-cap span { font: 500 var(--t-cap2)/1.3 var(--font); color: var(--fg-2); }
.ep-cap .progress { margin-top: 12px; }
.poster { width: 260px; height: 390px; }
.poster .ttl { position: absolute; left: 20px; right: 20px; bottom: 22px; font: 800 34px/1 var(--font); letter-spacing: -0.03em; text-wrap: balance; text-shadow: 0 2px 16px rgba(0,0,0,.4); }
.poster .badge { position: absolute; top: 14px; right: 14px; font: 700 18px/1 var(--font); background: var(--accent); padding: 7px 10px; border-radius: 8px; }
.under { position: absolute; left: 0; top: calc(100% + 18px); width: 140%; font: 500 var(--t-cap2)/1.3 var(--font); color: var(--fg-2); opacity: 0; transition: opacity .3s; white-space: nowrap; }
.tile-wrap { position: relative; flex: none; }
.tile-wrap:has(.focus) .under { opacity: 1; }
.chan { width: 400px; height: 225px; }
.logo { position: absolute; top: 18px; left: 18px; font: 800 24px/1 var(--font); letter-spacing: -0.02em; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.live { position: absolute; top: 18px; right: 18px; font: 800 17px/1 var(--font); letter-spacing: .06em; background: var(--live); padding: 7px 10px; border-radius: 7px; }
.now { position: absolute; left: 18px; right: 18px; bottom: 16px; }
.now b { display: block; font: 600 var(--t-cap2)/1.25 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .progress { margin-top: 10px; height: 5px; }
.now .progress i { background: var(--live); }

/* ---------- Detail ---------- */
.detail .body { bottom: auto; top: 250px; }
.seasons { position: absolute; left: var(--safe-x); top: 720px; display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.seg { font: 600 var(--t-cap1)/1 var(--font); color: var(--fg-2); padding: 14px 28px; border-radius: 999px; }
.seg.sel { color: #fff; background: var(--fill-2); }
.seg.f.focus { background: #fff; color: #000; transform: scale(1.06); }
.detail .eprow { position: absolute; left: 0; right: 0; top: 790px; }
.ep.small { width: 440px; height: 248px; }
.watched { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.5); display: grid; place-items: center; }
.watched svg { width: 20px; height: 20px; }

/* ---------- Player ---------- */
.player { position: absolute; inset: 0; background: #000; }
.player .art { animation: pan 18s linear infinite alternate; }
@keyframes pan { from { transform: scale(1.15) translate(-30px, 10px); } to { transform: scale(1.15) translate(30px, -10px); } }
.osd { position: absolute; left: 0; right: 0; bottom: 0; padding: 140px var(--safe-x) var(--safe-y); background: linear-gradient(transparent, rgba(0,0,0,.8));
  transition: opacity .35s var(--ease), transform .45s var(--ease); }
.osd.hide { opacity: 0; transform: translateY(40px); pointer-events: none; }
.osd .t { font: 700 var(--t-title3)/1.1 var(--font); letter-spacing: -0.02em; }
.osd .s { font: 500 var(--t-cap1)/1.3 var(--font); color: var(--fg-2); margin-top: 8px; }
.scrub { margin-top: 34px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.28); position: relative; }
.scrub i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: #fff; }
.scrub.f.focus { transform: scaleY(1.6); }
.times { display: flex; justify-content: space-between; margin-top: 14px; font: 600 var(--t-cap2)/1 var(--font); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.osd .actions { margin-top: 30px; }
.osd .btn { font-size: var(--t-cap1); padding: 16px 26px; border-radius: 14px; }
.flash { position: absolute; left: 50%; top: 50%; width: 160px; height: 160px; margin: -80px; border-radius: 50%; background: rgba(0,0,0,.45);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: grid; place-items: center; opacity: 0; transform: scale(.8); transition: opacity .25s, transform .4s var(--spring); }
.flash.on { opacity: 1; transform: scale(1); }
.flash svg { width: 70px; height: 70px; }
.banner { position: absolute; left: var(--safe-x); bottom: var(--safe-y); width: 880px; display: flex; gap: 28px; align-items: center; padding: 28px 32px; border-radius: 30px;
  background: var(--glass-strong); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 20px 60px rgba(0,0,0,.5); transition: opacity .3s var(--ease), transform .45s var(--spring); }
.banner.hide { opacity: 0; transform: translateY(30px) scale(.98); }
.banner .num { font: 700 var(--t-title2)/1 var(--font); font-variant-numeric: tabular-nums; min-width: 90px; }
.banner .lg { width: 150px; height: 84px; border-radius: 14px; position: relative; overflow: hidden; flex: none; display: grid; place-items: center; font: 800 30px/1 var(--font); }
.banner .info { flex: 1; min-width: 0; }
.banner .info b { font: 600 var(--t-callout)/1.2 var(--font); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner .info span { font: 500 var(--t-cap2)/1.4 var(--font); color: var(--fg-2); }
.banner .progress { margin-top: 12px; }
.banner .progress i { background: var(--live); }
.footer-strip { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 0 var(--safe-y); background: linear-gradient(transparent, rgba(0,0,0,.9) 30%);
  transition: transform .5s var(--ease), opacity .3s; }
.footer-strip.hide { transform: translateY(100%); opacity: 0; }
.footer-strip h4 { margin: 0 0 6px var(--safe-x); font: 600 var(--t-cap1)/1 var(--font); color: var(--fg-2); }
.tile.playing::before { content: ""; position: absolute; inset: 0; border: 4px solid #fff; border-radius: inherit; z-index: 2; }

/* ---------- Guide ---------- */
.guide-top { position: absolute; left: var(--safe-x); right: var(--safe-x); top: 160px; height: 270px; display: flex; gap: 48px; }
.preview { width: 480px; height: 270px; border-radius: 22px; overflow: hidden; position: relative; flex: none; }
.gdesc { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
.gdesc .t { font: 700 var(--t-title3)/1.1 var(--font); letter-spacing: -0.02em; }
.gdesc .s { font: 500 var(--t-cap1)/1.3 var(--font); color: var(--fg-2); }
.gdesc p { margin: 0; font: 400 var(--t-cap1)/1.45 var(--font); color: var(--fg-2); max-width: 900px; }
.grid { position: absolute; left: 0; right: 0; top: 470px; bottom: 0; }
.ghead { position: absolute; left: 400px; right: 0; top: 0; height: 46px; font: 600 var(--t-cap2)/46px var(--font); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.ghead span { position: absolute; top: 0; }
.grow { position: absolute; left: 0; right: 0; height: 92px; }
.gch { position: absolute; left: var(--safe-x); width: 300px; white-space: nowrap; height: 80px; display: flex; align-items: center; gap: 16px; font: 600 var(--t-cap1)/1 var(--font); }
.gch .n { color: var(--fg-3); font-variant-numeric: tabular-nums; width: 36px; }
.gch .lgm { width: 92px; height: 52px; border-radius: 10px; position: relative; overflow: hidden; display: grid; place-items: center; font: 800 20px/1 var(--font); }
.cell { position: absolute; height: 80px; border-radius: 14px; background: rgba(255,255,255,.07); padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.cell b { font: 600 var(--t-cap2)/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell span { font: 500 20px/1.3 var(--font); color: var(--fg-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell.nowc { background: rgba(255,255,255,.13); }
.cell.f.focus { background: #fff; color: #000; transform: scale(1.04); box-shadow: 0 16px 36px rgba(0,0,0,.5); }
.cell.f.focus span { color: rgba(0,0,0,.6); }
.nowline { position: absolute; top: 40px; bottom: 0; width: 3px; background: var(--live); border-radius: 2px; z-index: 6; box-shadow: 0 0 12px rgba(255,66,69,.6); }
.nowline::before { content: attr(data-t); position: absolute; top: -40px; left: 50%; transform: translateX(-50%); font: 700 20px/1 var(--font); background: var(--live); color: #fff; padding: 6px 8px; border-radius: 7px; }

/* ---------- Search ---------- */
.query { position: absolute; left: var(--safe-x); right: var(--safe-x); top: 190px; font: 600 var(--t-title2)/1 var(--font); letter-spacing: -0.02em; min-height: 70px; border-bottom: 2px solid var(--sep); padding-bottom: 18px; }
.query .ph { color: var(--fg-3); font-weight: 500; }
.query .caret { display: inline-block; width: 4px; height: 56px; background: var(--accent); vertical-align: -6px; margin-left: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kbd { position: absolute; left: var(--safe-x); right: var(--safe-x); top: 320px; display: flex; gap: 6px; justify-content: space-between; }
.key { font: 600 var(--t-cap1)/1 var(--font); color: var(--fg-2); width: 54px; height: 64px; border-radius: 12px; display: grid; place-items: center; }
.key.wide { width: 120px; font-size: var(--t-cap2); }
.key.f.focus { background: #fff; color: #000; transform: scale(1.18); }
.results { position: absolute; left: 0; right: 0; top: 440px; }

/* ---------- Settings ---------- */
.settings { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; }
.settings .side { width: 760px; display: grid; place-items: center; }
.settings .glyph { width: 340px; height: 340px; border-radius: 80px; display: grid; place-items: center; background: linear-gradient(160deg, #3a3a3c, #1c1c1e); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
.settings .glyph svg { width: 170px; height: 170px; color: #8e8e93; }
.settings .list { flex: 1; padding: 200px var(--safe-x) 0 0; display: flex; flex-direction: column; gap: 12px; }
.settings h2 { margin: 0 0 24px; font: 700 var(--t-title2)/1 var(--font); letter-spacing: -0.02em; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 26px 34px; border-radius: 20px; background: rgba(255,255,255,.06); font: 500 var(--t-body)/1.2 var(--font); }
.srow .v { color: var(--fg-2); display: flex; align-items: center; gap: 12px; }
.srow .v svg { width: 26px; height: 26px; opacity: .6; }
.srow.f.focus { background: #fff; color: #000; transform: scale(1.04); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.srow.f.focus .v { color: rgba(0,0,0,.6); }

/* ---------- Toast ---------- */
#toast { position: absolute; left: 50%; top: 60px; transform: translate(-50%, -30px); opacity: 0; z-index: 40; font: 600 var(--t-cap1)/1 var(--font);
  padding: 22px 34px; border-radius: 999px; background: var(--glass-strong); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 14px 40px rgba(0,0,0,.5); transition: opacity .3s, transform .45s var(--spring); white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-property: opacity, background-color, color !important; }
}
</style>

<div class="app">
  <div id="viewport">
    <div id="stage" aria-label="TV screen mockup" role="application">
      <div id="screen"></div>
      <nav id="tabbar"></nav>
      <div id="toast"></div>
    </div>
  </div>
  <div class="remote" aria-label="Remote control">
    <div class="grp">
      <button data-k="ArrowLeft" aria-label="Left">◀</button><button data-k="ArrowUp" aria-label="Up">▲</button>
      <button data-k="Enter" aria-label="Select">OK</button>
      <button data-k="ArrowDown" aria-label="Down">▼</button><button data-k="ArrowRight" aria-label="Right">▶</button>
    </div>
    <div class="grp">
      <button data-k="Escape">Back</button><button data-k="p" aria-label="Play or pause">▶︎❙❙</button>
      <button data-k="PageUp">CH +</button><button data-k="PageDown">CH −</button><button data-k="g">Guide</button>
    </div>
    <span class="hint"><kbd>←↑↓→</kbd> move · <kbd>Enter</kbd> select · <kbd>Esc</kbd> back · <kbd>Space</kbd> play/pause · <kbd>PgUp/PgDn</kbd> channel · <kbd>G</kbd> guide</span>
  </div>
</div>

<script>
(() => {
/* ================= Data (fictional catalogue) ================= */
const NOW = 20 * 60 + 7; // 20:07, fixed so the guide is consistent

const SERIES = [
  { id: 'northbound', title: 'Northbound', h: 205, year: 2025, genre: { en: 'Drama', de: 'Drama' }, age: 16, seasons: [8, 10],
    desc: { en: 'A ferry captain returns to the island she left twenty years ago, and finds the town keeping a secret about the last winter crossing.',
            de: 'Eine Fährkapitänin kehrt auf die Insel zurück, die sie vor zwanzig Jahren verlassen hat, und stößt auf ein Geheimnis um die letzte Winterüberfahrt.' },
    last: { s: 2, e: 5, left: 18, pct: 0.62 } },

    linear-gradient(165deg, hsl(${c},35%,14%), hsl(${a},45%,6%));`;
}

const epTile = (s, sn, e, opts = {}) => {

    ${watched ? `<div class="watched">${I.check}</div>` : ''}
    <div class="ep-cap"><b>${opts.title || `${e}. ${ttl}`}</b><span>${opts.sub || `${t('season')} ${sn} · ${42 + (e % 4) * 3} ${t('mins')}`}</span>
    ${pct ? `<div class="progress"><i style="width:${pct * 100}%"></i></div>` : ''}</div></div></div>`;
};
const posterTile = (it, act) => `<div class="tile-wrap"><div class="tile f poster" data-act="${act}" data-arg="${it.id}">
  ${artEl(it.h, it.year % 7)}<div class="sheen"></div><div class="ttl">${it.title}</div></div>
  <div class="under">${it.title} · ${L(it.genre)}</div></div>`;
const chanTile = (c, opts = {}) => {
  const p = onNow(c), pct = (NOW - p.a) / (p.b - p.a);
  return `<div class="tile-wrap"><div class="tile f chan ${opts.playing ? 'playing' : ''}" data-act="playLive" data-arg="${c.n}">
    ${artEl(c.h, c.n)}<div class="sheen"></div><div class="logo">${c.s}</div><div class="live">${t('liveNow')}</div>
    <div class="now"><b>${p.t}</b><div class="progress"><i style="width:${pct * 100}%"></i></div></div></div>

const row = (id, title, tiles) => `<section class="row" data-rowbox="${id}"><h3>${title}</h3><div class="track" data-track="${id}">${tiles}</div></section>`;
const rowTiles = (html, id) => html.replace(/class="tile f /g, `data-row="${id}" class="tile f `);

/* ================= Focus engine (directional, like tvOS) ================= */
let cur = null;

function focusables() {

    if (dir === 'left') { if (b.right > a.left + 4 && bx >= ax - 2) continue; primary = Math.max(0, a.left - b.right); secondary = Math.abs(by - ay); }
    if (dir === 'down') { if (by <= ay + 4) continue; primary = Math.max(0, b.top - a.bottom); secondary = Math.abs(bx - ax); }
    if (dir === 'up') { if (by >= ay - 4) continue; primary = Math.max(0, a.top - b.bottom); secondary = Math.abs(bx - ax); }

  if (!horiz && best.dataset.row && best.dataset.row !== cur.dataset.row && memory[best.dataset.row] != null && !best.dataset.row.startsWith('g')) {

/* Keep the focused item on screen: rows slide sideways, the page slides up. */
function reveal(el) {

function onFocusChange(el) {

    const [n, a] = el.dataset.prog.split('|').map(Number);
    const ch = CHANNELS.find(c => c.n === n), p = ch.sched.find(x => x.a === a);

/* ================= Navigation ================= */
function show({ keep } = {}) {
  let html;

  else html = SCREENS[S.tab]();
  const scroll = !S.player && !['guide', 'search', 'settings'].includes(S.tab) || S.view;
  screenEl.innerHTML = S.player || !scroll ? html : `<div class="scroller">${html}</div>`;
  tabbar.style.display = S.player || S.view ? 'none' : '';
  tabbar.classList.remove('away');
  renderTabbar();
  cur = null;
  const want = keep && stage.querySelector(keep);
  setFocus(want || firstFocus());
  // The guide always opens describing what is on now on the current channel.
  if (!S.player && !S.view && S.tab === 'guide' && !(cur && cur.dataset.prog)) onFocusChange(stage.querySelector(`.cell.nowc[data-prog^="${S.chan}|"]`) || stage.querySelector('.cell.nowc'));

function firstFocus() {

}
const back = [];
function open(view) { back.push({ tab: S.tab, view: S.view, focus: cur && selectorFor(cur) }); S.view = view; show(); }

let osdTimer;

let playing = true;
let vodTick;
function startVod(p) {

}
function updScrub() {

const ACT = {
  tab(k) { S.tab = k; S.view = null; back.length = 0; show({ keep: `.tab[data-arg="${k}"]` }); },
  openSeries(id) { open({ kind: 'series', id }); },
  openMovie(id) { open({ kind: 'movie', id }); },
  season(arg) { const [id, n] = arg.split('|'); S.season[id] = +n; show({ keep: `.seg[data-arg="${CSS.escape(arg)}"]` }); },
  fav(id) { S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); show({ keep: `[data-act="fav"]` }); toast(S.favs.has(id) ? (lang === 'de' ? 'Zu Favoriten hinzugefügt' : 'Added to Favourites') : (lang === 'de' ? 'Aus Favoriten entfernt' : 'Removed from Favourites')); },

    S.view = S.view || { kind: 'movie', id };
    startVod({ kind: 'movie', id, h: m.h, title: m.title, sub: `${m.year} · ${L(m.genre)}`, dur: m.mins * 60, pos: (m.pct || 0) * m.mins * 60 });

  playLive(n) {

function activate() {
  if (!cur) return;
  const el = cur; el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 110);
  const fn = ACT[el.dataset.act]; if (fn) setTimeout(() => fn(el.dataset.arg), 90);
}
function goBack() {

let toastT;

      S.player.pos = Math.max(0, Math.min(S.player.dur, S.player.pos + (k === 'ArrowLeft' ? -10 : 10))); updScrub(); return;
    }
  }
  if (k === 'ArrowLeft') move('left');
  else if (k === 'ArrowRight') move('right');
  else if (k === 'ArrowUp') move('up');
  else if (k === 'ArrowDown') move('down');
  else if (k === 'Enter') activate();
}

/* ================= Fit the 1920 x 1080 canvas ================= */
const vp = $('#viewport');
function fit() {
  const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  stage.style.transform = `scale(${s})`;
  stage.style.left = (vp.clientWidth - 1920 * s) / 2 + 'px';
  stage.style.top = (vp.clientHeight - 1080 * s) / 2 + 'px';
}
new ResizeObserver(fit).observe(vp); fit();
