name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMEN_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LUMEN_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LUMEN_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "LUMEN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "LUMEN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "LUMEN_KEY_ALIAS=$KEY_ALIAS"
              echo "LUMEN_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing the release APK with the repository keystore."
          else
            echo "::warning::No LUMEN_KEYSTORE_BASE64 secret: the release APK is signed with the debug key."
          fi

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/lumen-${LUMEN_VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/lumen-${LUMEN_VERSION_NAME}-release.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: lumen-apks
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*.apk
          generate_release_notes: true
